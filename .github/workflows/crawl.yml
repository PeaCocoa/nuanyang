name: 定时爬虫

on:
  schedule:
    # UTC时间22:00和07:00 = 北京时间06:00和15:00
    - cron: '0 22 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write  # 允许推送代码

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 检查是否19日（每月19日休息）
        id: check_date
        run: |
          DAY=$(date -u -d '+8 hours' '+%d')
          echo "今天是北京时间 $DAY 日"
          if [ "$DAY" = "19" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "每月19日休息，跳过爬虫"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 运行爬虫
        if: steps.check_date.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m crawler.worker

      - name: 推送数据
        if: steps.check_date.outputs.skip != 'true'
        run: |
          git config user.name "暖阳爬虫机器人"
          git config user.email "actions@github.com"
          git add data/videos.json web/data/videos.json
          git diff --staged --quiet || git commit -m "自动更新视频数据 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S')"
          git push
