<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>暖阳爬虫控制台 v2</title>
    <style>
        :root {
            --rausch: #FF385C;
            --rausch-dark: #E00B41;
            --ink: #222222;
            --ash: #6A6A6A;
            --mute: #929292;
            --stone: #C1C1C1;
            --canvas: #FFFFFF;
            --cloud: #F7F7F7;
            --hairline: #DDDDDD;
            --green: #00A699;
            --orange: #FC642D;
            --error: #C13515;
            --radius-sm: 8px;
            --radius-md: 14px;
        }

        body.dark {
            --ink: #F7F7F7;
            --ash: #AAAAAA;
            --mute: #888888;
            --stone: #555555;
            --canvas: #1A1A1A;
            --cloud: #2A2A2A;
            --hairline: #3A3A3A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            background: var(--canvas);
            color: var(--ink);
            font-size: 15px;
            line-height: 1.5;
            transition: background 0.25s, color 0.25s;
        }

        /* === 顶栏 === */
        .header {
            background: var(--canvas);
            border-bottom: 1px solid var(--hairline);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 16px; }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--rausch);
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--ash);
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary {
            background: var(--rausch);
            color: white;
        }
        .btn-primary:hover:not(:disabled) { background: var(--rausch-dark); }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--hairline);
            color: var(--ink);
        }
        .btn-outline:hover:not(:disabled) { border-color: var(--ash); }

        .btn-green {
            background: var(--green);
            color: white;
        }

        .state-badge {
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }
        .state-idle { background: var(--cloud); color: var(--mute); }
        .state-running { background: #FFF3E0; color: var(--orange); }
        .state-running::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--orange);
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .state-done { background: #E8F7F5; color: var(--green); }
        .state-error { background: #FDEDED; color: var(--error); }

        .theme-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--hairline);
            background: var(--cloud);
            border-radius: 50%;
            cursor: pointer;
            color: var(--ink);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* === Tab 导航 === */
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--hairline);
            padding: 0 24px;
            background: var(--canvas);
        }
        .tab {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--ash);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .tab:hover { color: var(--ink); }
        .tab.active {
            color: var(--rausch);
            border-bottom-color: var(--rausch);
        }

        /* === 主体布局 === */
        .main {
            display: flex;
            gap: 0;
            height: calc(100vh - 110px);
        }

        .left-panel {
            flex: 0 0 380px;
            border-right: 1px solid var(--hairline);
            overflow-y: auto;
            padding: 20px;
        }

        .right-panel {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* === 统计卡片 === */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--cloud);
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--ink);
        }

        .stat-value.green { color: var(--green); }
        .stat-value.rausch { color: var(--rausch); }

        .stat-label {
            font-size: 12px;
            color: var(--mute);
            margin-top: 4px;
        }

        /* === 进度条 === */
        .progress-section { margin-bottom: 20px; }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .progress-label { font-size: 13px; font-weight: 600; color: var(--ink); }
        .progress-count { font-size: 13px; color: var(--ash); }

        .progress-bar {
            height: 8px;
            background: var(--cloud);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--rausch);
            border-radius: 999px;
            transition: width 0.5s ease;
        }

        /* === 登录提示 === */
        .login-banner {
            background: linear-gradient(135deg, #FF385C, #E00B41);
            color: white;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            display: none;
        }
        .login-banner.show { display: block; }
        .login-banner-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .login-banner-desc { font-size: 13px; opacity: 0.9; }

        /* === UP主列表 === */
        .up-list { display: flex; flex-direction: column; gap: 4px; }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--mute);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .up-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
        }
        .up-item:hover { background: var(--cloud); }
        .up-item.current { background: #FFF3E0; }
        body.dark .up-item.current { background: #3A2A1A; }

        .up-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-pending { background: var(--stone); }
        .dot-searching, .dot-fetching, .dot-filtering { background: var(--orange); animation: pulse 1.2s infinite; }
        .dot-done { background: var(--green); }
        .dot-failed { background: var(--error); }
        .dot-skipped { background: var(--mute); }

        .up-name { flex: 1; font-size: 14px; font-weight: 500; color: var(--ink); }
        .up-category { font-size: 11px; color: var(--mute); }
        .up-videos { font-size: 13px; font-weight: 600; color: var(--green); min-width: 30px; text-align: right; }
        .up-videos.zero { color: var(--mute); }
        .up-videos.failed { color: var(--error); }

        /* === 日志 === */
        .log-section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--mute);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .log-auto-scroll {
            font-size: 11px;
            color: var(--ash);
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
        }

        .log-container {
            background: var(--cloud);
            border-radius: var(--radius-md);
            padding: 12px;
            font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .log-line { display: flex; gap: 8px; padding: 1px 0; }
        .log-time { color: var(--mute); flex-shrink: 0; font-size: 12px; }
        .log-msg { color: var(--ink); word-break: break-all; }
        .log-msg.warn { color: var(--orange); }
        .log-msg.error { color: var(--error); }
        .log-msg.info { color: var(--ash); }

        /* === 设置面板 === */
        .settings-panel { max-width: 700px; }

        .settings-group {
            background: var(--cloud);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 16px;
        }

        .settings-group-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 16px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .settings-row:last-child { margin-bottom: 0; }

        .settings-label { font-size: 14px; color: var(--ink); font-weight: 500; }
        .settings-desc { font-size: 12px; color: var(--mute); margin-top: 2px; }

        .settings-input {
            width: 100px;
            padding: 6px 10px;
            border: 1px solid var(--hairline);
            border-radius: var(--radius-sm);
            background: var(--canvas);
            color: var(--ink);
            font-size: 14px;
            text-align: center;
        }

        .settings-select {
            padding: 6px 10px;
            border: 1px solid var(--hairline);
            border-radius: var(--radius-sm);
            background: var(--canvas);
            color: var(--ink);
            font-size: 14px;
        }

        /* === 开关 === */
        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
            background: var(--stone);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .toggle.on { background: var(--green); }
        .toggle::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle.on::after { transform: translateX(20px); }

        /* === UP主选择网格 === */
        .up-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .up-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid var(--hairline);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .up-checkbox:hover { border-color: var(--ash); }
        .up-checkbox.checked { border-color: var(--green); background: rgba(0,166,153,0.08); }
        body.dark .up-checkbox.checked { background: rgba(0,166,153,0.15); }

        .up-checkbox input { display: none; }

        .up-checkbox-name { font-size: 13px; font-weight: 500; color: var(--ink); }
        .up-checkbox-cat { font-size: 11px; color: var(--mute); }

        .up-select-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .link-btn {
            font-size: 13px;
            color: var(--rausch);
            cursor: pointer;
            text-decoration: none;
        }
        .link-btn:hover { text-decoration: underline; }

        /* === Toast === */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--ink);
            color: var(--canvas);
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            z-index: 999;
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* === 响应式 === */
        @media (max-width: 768px) {
            .main { flex-direction: column; height: auto; }
            .left-panel { flex: none; border-right: none; border-bottom: 1px solid var(--hairline); }
            .right-panel { flex: none; }
            .log-container { max-height: 400px; }
            .up-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <div>
                <div class="header-title">暖阳爬虫控制台</div>
                <div class="header-subtitle" id="subtitle">等待启动...</div>
            </div>
        </div>
        <div class="header-right">
            <span class="state-badge state-idle" id="stateBadge">空闲</span>
            <button class="btn btn-primary" id="startBtn" onclick="startCrawl()">立即开爬</button>
            <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">&#127769;</button>
        </div>
    </header>

    <!-- Tab 导航 -->
    <div class="tabs">
        <div class="tab active" data-tab="monitor" onclick="switchTab('monitor')">监控</div>
        <div class="tab" data-tab="settings" onclick="switchTab('settings')">设置</div>
    </div>

    <!-- 监控面板 -->
    <div class="main" id="tab-monitor">
        <div class="left-panel">
            <div class="login-banner" id="loginBanner">
                <div class="login-banner-title">需要登录B站</div>
                <div class="login-banner-desc">请在弹出的浏览器窗口中扫码登录，登录后自动继续</div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value rausch" id="statDone">0</div>
                    <div class="stat-label">已完成UP主</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value green" id="statVideos">0</div>
                    <div class="stat-label">抓取视频数</div>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-header">
                    <span class="progress-label">总进度</span>
                    <span class="progress-count" id="progressText">0 / 0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div style="font-size:12px;color:var(--mute);margin-top:6px;" id="currentStep"></div>
            </div>

            <div class="section-title">UP主列表</div>
            <div class="up-list" id="upList">
                <div style="color:var(--mute);font-size:13px;padding:8px 0;">等待爬虫启动...</div>
            </div>
        </div>

        <div class="right-panel">
            <div class="log-section-title">
                <span>实时日志</span>
                <label class="log-auto-scroll">
                    <input type="checkbox" id="autoScroll" checked> 自动滚动
                </label>
            </div>
            <div class="log-container" id="logContainer">
                <div class="log-line">
                    <span class="log-time">--:--:--</span>
                    <span class="log-msg">等待爬虫启动...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="main" id="tab-settings" style="display:none;">
        <div class="right-panel">
            <div class="settings-panel">
                <!-- 爬取控制 -->
                <div class="settings-group">
                    <div class="settings-group-title">爬取控制</div>

                    <div class="settings-row">
                        <div>
                            <div class="settings-label">测试模式</div>
                            <div class="settings-desc">只爬前2个UP主，用于快速验证</div>
                        </div>
                        <div class="toggle" id="toggleTestMode" onclick="toggleSetting('test_mode', this)"></div>
                    </div>

                    <div class="settings-row">
                        <div>
                            <div class="settings-label">每个UP主爬取数量</div>
                            <div class="settings-desc">每位UP主最多保留多少条视频</div>
                        </div>
                        <input type="number" class="settings-input" id="inputMaxVideos" min="1" max="20" value="5">
                    </div>
                </div>

                <!-- 筛选条件 -->
                <div class="settings-group">
                    <div class="settings-group-title">视频筛选条件</div>

                    <div class="settings-row">
                        <div>
                            <div class="settings-label">最短时长（秒）</div>
                            <div class="settings-desc">短于此时间的视频将被过滤</div>
                        </div>
                        <input type="number" class="settings-input" id="inputDurationMin" min="0" max="3600" value="60">
                    </div>

                    <div class="settings-row">
                        <div>
                            <div class="settings-label">最长时长（秒）</div>
                            <div class="settings-desc">长于此时间的视频将被过滤</div>
                        </div>
                        <input type="number" class="settings-input" id="inputDurationMax" min="60" max="7200" value="900">
                    </div>

                    <div class="settings-row">
                        <div>
                            <div class="settings-label">投稿时间限制（天）</div>
                            <div class="settings-desc">0 = 不限制，仅保留最近N天的投稿</div>
                        </div>
                        <input type="number" class="settings-input" id="inputPubdateDays" min="0" max="3650" value="0">
                    </div>
                </div>

                <!-- UP主选择 -->
                <div class="settings-group">
                    <div class="settings-group-title">UP主选择</div>
                    <div class="settings-desc" style="margin-bottom:8px;">不勾选则爬取全部UP主</div>
                    <div class="up-select-actions">
                        <a class="link-btn" onclick="selectAllUps(true)">全选</a>
                        <a class="link-btn" onclick="selectAllUps(false)">全不选</a>
                    </div>
                    <div class="up-grid" id="upGrid">
                        <div style="color:var(--mute);font-size:13px;">加载中...</div>
                    </div>
                </div>

                <!-- 保存按钮 -->
                <div style="display:flex;gap:12px;margin-top:20px;">
                    <button class="btn btn-green" onclick="saveSettings()">保存设置</button>
                    <button class="btn btn-outline" onclick="loadSettings()">重置</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_STATUS = '/api/status';
        const API_SETTINGS = '/api/settings';
        const API_UPMASTERS = '/api/upmasters';
        const API_START = '/api/start';

        let lastLogCount = 0;
        let isDark = false;
        let allUpmasters = [];
        let currentSettings = {};
        let isRunning = false;

        // === Tab 切换 ===
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('tab-monitor').style.display = tab === 'monitor' ? 'flex' : 'none';
            document.getElementById('tab-settings').style.display = tab === 'settings' ? 'flex' : 'none';
            if (tab === 'settings') loadSettings();
        }

        // === 主题 ===
        function toggleTheme() {
            isDark = !isDark;
            document.body.classList.toggle('dark', isDark);
            document.getElementById('themeBtn').innerHTML = isDark ? '&#9728;&#65039;' : '&#127769;';
        }

        // === Toast ===
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // === 启动爬虫 ===
        async function startCrawl() {
            try {
                const resp = await fetch(API_START, { method: 'POST' });
                const data = await resp.json();
                if (data.ok) {
                    showToast('爬虫已启动');
                    switchTab('monitor');
                } else {
                    showToast(data.msg || '启动失败');
                }
            } catch (e) {
                showToast('无法连接服务器');
            }
        }

        // === 加载UP主列表 ===
        async function loadUpmasters() {
            try {
                const resp = await fetch(API_UPMASTERS);
                const data = await resp.json();
                if (data.ups) {
                    allUpmasters = data.ups;
                    renderUpGrid();
                }
            } catch (e) {}
        }

        function renderUpGrid() {
            const grid = document.getElementById('upGrid');
            const selected = new Set(currentSettings.selected_ups || []);
            grid.innerHTML = allUpmasters.map(up => `
                <label class="up-checkbox ${selected.has(up.name) ? 'checked' : ''}" data-up-name="${up.name}">
                    <input type="checkbox" value="${up.name}" ${selected.has(up.name) ? 'checked' : ''} onchange="toggleUpCheckbox(this)">
                    <div>
                        <div class="up-checkbox-name">${up.name}</div>
                        <div class="up-checkbox-cat">${Array.isArray(up.categories) ? up.categories.join(" · ") : up.categories}</div>
                    </div>
                </label>
            `).join('');
        }

        function toggleUpCheckbox(input) {
            const label = input.closest('.up-checkbox');
            label.classList.toggle('checked', input.checked);
        }

        function selectAllUps(select) {
            document.querySelectorAll('#upGrid input[type=checkbox]').forEach(cb => {
                cb.checked = select;
                cb.closest('.up-checkbox').classList.toggle('checked', select);
            });
        }

        // === 设置 ===
        async function loadSettings() {
            try {
                const resp = await fetch(API_SETTINGS);
                currentSettings = await resp.json();
                renderSettings();
            } catch (e) {
                showToast('加载设置失败');
            }
        }

        function renderSettings() {
            // 测试模式
            const testToggle = document.getElementById('toggleTestMode');
            testToggle.classList.toggle('on', !!currentSettings.test_mode);

            // 数值输入
            document.getElementById('inputMaxVideos').value = currentSettings.max_videos_per_up ?? 5;
            document.getElementById('inputDurationMin').value = currentSettings.duration_min ?? 60;
            document.getElementById('inputDurationMax').value = currentSettings.duration_max ?? 900;
            document.getElementById('inputPubdateDays').value = currentSettings.pubdate_days ?? 0;

            // UP主选择网格
            renderUpGrid();
        }

        function toggleSetting(key, el) {
            currentSettings[key] = !currentSettings[key];
            el.classList.toggle('on', currentSettings[key]);
        }

        async function saveSettings() {
            // 收集选中的UP主
            const selectedUps = Array.from(document.querySelectorAll('#upGrid input[type=checkbox]:checked'))
                .map(cb => cb.value);

            const settings = {
                test_mode: currentSettings.test_mode || false,
                max_videos_per_up: parseInt(document.getElementById('inputMaxVideos').value) || 5,
                duration_min: parseInt(document.getElementById('inputDurationMin').value) || 60,
                duration_max: parseInt(document.getElementById('inputDurationMax').value) || 900,
                pubdate_days: parseInt(document.getElementById('inputPubdateDays').value) || 0,
                selected_ups: selectedUps,
            };

            try {
                const resp = await fetch(API_SETTINGS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings),
                });
                const data = await resp.json();
                if (data.ok) {
                    currentSettings = data.settings;
                    showToast('设置已保存');
                } else {
                    showToast(data.msg || '保存失败');
                }
            } catch (e) {
                showToast('无法连接服务器');
            }
        }

        // === 轮询状态 ===
        async function poll() {
            try {
                console.log('[poll] fetching...');
                const resp = await fetch(API_STATUS + '?t=' + Date.now());
                console.log('[poll] response status:', resp.status);
                if (!resp.ok) return;
                const data = await resp.json();
                console.log('[poll] data:', data.state, data.done_ups, '/', data.total_ups);
                render(data);
            } catch (e) {}
        }

        function render(data) {
            isRunning = data.state === 'running';

            // 状态徽章
            const badge = document.getElementById('stateBadge');
            const stateMap = {
                idle: ['state-idle', '空闲'],
                running: ['state-running', '运行中'],
                done: ['state-done', '已完成'],
                error: ['state-error', '出错'],
            };
            const [cls, label] = stateMap[data.state] || stateMap.idle;
            badge.className = 'state-badge ' + cls;
            badge.textContent = label;

            // 启动按钮状态
            const startBtn = document.getElementById('startBtn');
            startBtn.disabled = isRunning;
            startBtn.textContent = isRunning ? '运行中...' : '立即开爬';

            // 副标题
            const subtitle = document.getElementById('subtitle');
            if (data.state === 'running') {
                if (data.login_required) {
                    subtitle.textContent = '等待扫码登录B站...';
                } else if (data.current_up) {
                    const stepMap = { searching: '搜索中', fetching: '获取详情中', filtering: '筛选中' };
                    subtitle.textContent = `${data.current_up} - ${stepMap[data.current_step] || data.current_step}`;
                } else {
                    subtitle.textContent = '正在运行...';
                }
            } else if (data.state === 'done') {
                const elapsed = data.end_time > 0 ? Math.round((data.end_time - data.start_time) / 1000) : 0;
                subtitle.textContent = `完成 - 耗时 ${elapsed}s - ${data.total_videos} 条视频`;
            } else if (data.state === 'error') {
                subtitle.textContent = '爬虫出错，请检查日志';
            } else {
                subtitle.textContent = '就绪 - 点击"立即开爬"开始';
            }

            // 登录提示
            document.getElementById('loginBanner').classList.toggle('show', data.login_required);

            // 统计
            document.getElementById('statDone').textContent = data.done_ups;
            document.getElementById('statVideos').textContent = data.total_videos;

            // 进度条
            const pct = data.total_ups > 0 ? (data.done_ups / data.total_ups * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = `${data.done_ups} / ${data.total_ups}`;

            const stepMap = { searching: '搜索中', fetching: '获取视频详情中', filtering: '筛选中' };
            document.getElementById('currentStep').textContent =
                data.current_up ? `当前: ${data.current_up} - ${stepMap[data.current_step] || ''}` : '';

            // UP主列表
            const upList = document.getElementById('upList');
            if (data.ups && data.ups.length > 0) {
                upList.innerHTML = data.ups.map(up => {
                    const isCurrent = up.name === data.current_up && data.state === 'running';
                    const statusMap = {
                        pending: 'dot-pending', searching: 'dot-searching',
                        fetching: 'dot-fetching', filtering: 'dot-filtering',
                        done: 'dot-done', failed: 'dot-failed', skipped: 'dot-skipped',
                    };
                    const dotCls = statusMap[up.status] || 'dot-pending';
                    const videoCls = up.status === 'failed' ? 'failed' : (up.videos === 0 ? 'zero' : '');
                    const videoText = up.status === 'failed' ? '失败' :
                                      up.status === 'pending' ? '—' :
                                      up.status === 'skipped' ? '跳过' :
                                      up.videos + '条';
                    return `
                        <div class="up-item ${isCurrent ? 'current' : ''}">
                            <span class="up-status-dot ${dotCls}"></span>
                            <div style="flex:1;min-width:0;">
                                <div class="up-name">${up.name}</div>
                                <div class="up-category">${Array.isArray(up.categories) ? up.categories.join(" · ") : up.categories}</div>
                            </div>
                            <span class="up-videos ${videoCls}">${videoText}</span>
                        </div>
                    `;
                }).join('');
            }

            // 日志
            const logContainer = document.getElementById('logContainer');
            if (data.logs && data.logs.length > 0) {
                if (data.logs.length !== lastLogCount) {
                    logContainer.innerHTML = data.logs.map(l => `
                        <div class="log-line">
                            <span class="log-time">${l.time}</span>
                            <span class="log-msg ${l.level}">${escapeHtml(l.msg)}</span>
                        </div>
                    `).join('');
                    lastLogCount = data.logs.length;
                    if (document.getElementById('autoScroll').checked) {
                        logContainer.scrollTop = logContainer.scrollHeight;
                    }
                }
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // === 初始化 ===
        async function init() {
            // 先启动轮询，确保控制台能实时显示状态
            poll();
            setInterval(poll, 1000);
            // 再异步加载UP主列表和设置（不阻塞轮询）
            loadUpmasters().catch(function(){});
            loadSettings().catch(function(){});
        }

        init();
    </script>

</body>
</html>
